<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c47a8d" />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Pakistani Ladies Suits – Premium Lawn, Cotton & Embroidered</title>
    <meta
      name="description"
      content="Shop premium Pakistani ladies suits — 2 piece, 3 piece, lawn, cotton and embroidered outfits at the best prices. Order easily on WhatsApp."
    />
    <style>
      /* App loading screen — shown before React mounts */
      #app-loader {
        position: fixed;
        inset: 0;
        background: #fdfaf6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-loader svg {
        animation: loader-pulse 1.4s ease-in-out infinite;
      }
      #app-loader__spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #f1e8dd;
        border-top-color: #c47a8d;
        border-radius: 50%;
        animation: loader-spin 0.8s linear infinite;
      }
      #app-loader__brand {
        font-family: Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: #4a3f3a;
        letter-spacing: 0.01em;
      }
      #app-loader__sub {
        font-family: sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #9c8f86;
        margin-top: -0.8rem;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      @keyframes loader-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
  </head>
  <body>
    <!-- Loading screen visible while JS loads -->
    <div id="app-loader" aria-label="Loading" role="status">
      <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(125deg,#c47a8d,#dd9bab,#e6b79f);display:grid;place-items:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
      <div id="app-loader__brand">Ladies Suits</div>
      <div id="app-loader__sub">Elegance · Crafted</div>
      <div id="app-loader__spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
